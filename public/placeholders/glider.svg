<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#skyGrad)" />
  <!-- Dhauladhar Mountains in background -->
  <polygon points="0,320 120,220 220,290 350,180 480,270 600,210 600,400 0,400" fill="#0f172a" opacity="0.65" />
  <polygon points="0,350 180,270 300,320 450,240 600,300 600,400 0,400" fill="#0369a1" opacity="0.4" />
  <!-- Paraglider Wing Canopy Arc -->
  <path d="M 150 140 Q 300 40 450 140 Q 300 110 150 140 Z" fill="url(#wingGrad)" stroke="#ffffff" stroke-width="2" />
  <!-- Cell rib lines -->
  <path d="M 210 120 Q 300 95 390 120" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
  <!-- Suspension Lines -->
  <line x1="160" y1="138" x2="300" y2="240" stroke="#ffffff" stroke-width="1.2" opacity="0.75" />
  <line x1="220" y1="110" x2="300" y2="240" stroke="#ffffff" stroke-width="1.2" opacity="0.75" />
  <line x1="300" y1="95" x2="300" y2="240" stroke="#ffffff" stroke-width="1.2" opacity="0.75" />
  <line x1="380" y1="110" x2="300" y2="240" stroke="#ffffff" stroke-width="1.2" opacity="0.75" />
  <line x1="440" y1="138" x2="300" y2="240" stroke="#ffffff" stroke-width="1.2" opacity="0.75" />
  <!-- Pilot in Harness -->
  <circle cx="300" cy="240" r="10" fill="#ffffff" />
  <ellipse cx="300" cy="255" rx="14" ry="18" fill="#1e293b" />
  <text x="300" y="370" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">GIN BOLERO 6 • BIR-BILLING</text>
</svg>
