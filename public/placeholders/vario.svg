<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#082f49" />
  <!-- Instrument Case -->
  <rect x="210" y="80" width="180" height="240" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="4" />
  <!-- High Contrast LCD Screen -->
  <rect x="230" y="110" width="140" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text x="300" y="145" font-family="monospace" font-size="28" font-weight="900" fill="#0369a1" text-anchor="middle">+3.2 m/s</text>
  <text x="300" y="185" font-family="monospace" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">2,430 M</text>
  <text x="300" y="225" font-family="monospace" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle">BILLING LAUNCH</text>
  <!-- Control buttons -->
  <circle cx="260" cy="285" r="10" fill="#f59e0b" />
  <circle cx="300" cy="285" r="10" fill="#38bdf8" />
  <circle cx="340" cy="285" r="10" fill="#10b981" />
  <text x="300" y="365" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">FLYMASTER VARIO SD</text>
</svg>
